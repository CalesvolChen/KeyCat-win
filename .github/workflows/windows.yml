name: Windows

# Builds the Tauri shell in win/ on a real Windows runner. Tag pushes also publish the installer
# plus latest.json, which is what the app's updater reads, and latest.yml, which moves 1.0.x
# installs (Electron, electron-updater) over to this build.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: win/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: win

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match win/package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Only release builds need access to the updater signing key.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY is required to publish a release" >&2
              exit 1
            fi
            npm run dist
          else
            npm run dist -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Collect release files
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p out
          cp target/release/bundle/nsis/KeyCat_"$version"_x64-setup.exe out/KeyCat-Windows-Setup.exe
          ls -l out
          [[ "$GITHUB_REF" == refs/tags/v* ]] || exit 0
          signature_file="target/release/bundle/nsis/KeyCat_${version}_x64-setup.exe.sig"
          if [ ! -s "$signature_file" ]; then
            echo "Updater signature is missing: $signature_file" >&2
            exit 1
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/KeyCat-Windows-Setup.exe"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="$version" URL="$url" DATE="$date" \
          SIG="$(cat "$signature_file")" \
          node -e '
            const fs = require("fs");
            const { VERSION, URL, DATE, SIG } = process.env;
            fs.writeFileSync("out/latest.json", JSON.stringify({
              version: VERSION,
              pub_date: DATE,
              platforms: { "windows-x86_64": { signature: SIG, url: URL } },
            }, null, 2));
            const exe = fs.readFileSync("out/KeyCat-Windows-Setup.exe");
            const sha512 = require("crypto").createHash("sha512").update(exe).digest("base64");
            fs.writeFileSync("out/latest.yml", [
              `version: ${VERSION}`,
              "files:",
              "  - url: KeyCat-Windows-Setup.exe",
              `    sha512: ${sha512}`,
              `    size: ${exe.length}`,
              "path: KeyCat-Windows-Setup.exe",
              `sha512: ${sha512}`,
              `releaseDate: '\''${DATE}'\''`,
              "",
            ].join("\n"));
          '
          cat out/latest.json out/latest.yml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(out/KeyCat-Windows-Setup.exe out/latest.json out/latest.yml)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: keycat-windows
          path: win/out/*
          if-no-files-found: error
